[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "emergent-rpg-engine"
version = "0.1.0"
description = "Deterministic canonical-state engine for long-running AI-driven text RPGs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8,<3",
  "SQLAlchemy>=2.0,<3",
  "typer>=0.12,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "httpx>=0.27,<1",
]

[project.scripts]
emergent-rpg = "emergent_rpg.cli.app:app"
emergent-rpg-api = "emergent_rpg.api.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/emergent_rpg"]

[tool.hatch.build.targets.wheel.force-include]
"src/emergent_rpg/web/static" = "emergent_rpg/web/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["emergent_rpg"]


[[tool.mypy.overrides]]
module = "emergent_rpg.engine.resolver"
disable_error_code = ["no-redef"]
