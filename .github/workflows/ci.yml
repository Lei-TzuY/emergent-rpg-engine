name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pip wheel . --no-deps -w /tmp/emergent-wheel
      - name: Verify wheel web assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("/tmp/emergent-wheel").glob("*.whl"))
          expected = {
              "emergent_rpg/web/static/index.html",
              "emergent_rpg/web/static/app.js",
              "emergent_rpg/web/static/styles.css",
          }
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          missing = expected - names
          if missing:
              raise SystemExit(f"wheel missing browser assets: {sorted(missing)}")
          print(f"verified browser assets in {wheel.name}")
          PY
      - run: ruff check .
      - run: mypy src/emergent_rpg
      - run: pytest
      - name: Run 1000-turn consistency evaluation
        run: |
          emergent-rpg-eval \
            --db /tmp/emergent-eval.db \
            --turns 1000 \
            --seed 20260911 \
            --checkpoint-interval 100 \
            --output /tmp/emergent-eval.json
      - name: Verify evaluation report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/emergent-eval.json").read_text(encoding="utf-8"))
          assert report["passed"] is True, report["failures"]
          assert report["accepted_turns"] == 1000
          assert report["target_accepted_turns"] == 1000
          assert report["rejected_actions"] > 0
          assert report["checkpoint_turns"][-1] == 1000
          assert report["replay_equal"] is True
          assert report["state_valid"] is True
          assert report["event_log_monotonic"] is True
          assert report["unique_event_ids"] is True
          print("verified deterministic 1000-turn consistency report")
          PY
